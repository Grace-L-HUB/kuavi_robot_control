# 轮臂 Kuavo 4 Pro：头顶相机俯视 -> IK 基座 (X前 Y左 Z上)
# 左手：Y 镜像右手；Z 对齐 hand=left 时右手待机夹爪高度；X 略收回防碰机身

camera_frame: "camera_depth_optical_frame"
ik_target_frames:
  - "base_link"
  - "torso"
  - "pelvis"
  - "odom"
  - "base"

static_transform:
  pitch_deg: 51.0
  camera_position_in_base: [0.10, 0.0, 0.58]
  lateral_sign: -1.0
  forward_depth_scale: 1.0
  height_from_depth_scale: 0.95

grasp_offsets:
  forward_extra_m: 0.02
  depth_forward_scale: 1.0
  center_y_bias: 0.02
  grasp_z_bias: 0.0
  grasp_depth_z: 0.0
  symmetric_mirror_y: true
  left_grasp_z_from_inactive: true
  # 相对右手待机 Z(≈0.12)：水平夹爪指尖补偿 + 总高度微调
  left_z_tip_offset: -0.10
  left_z_fine: -0.05
  left_y_fine: 0.0
  # 较视觉前向点略收回，轨迹更接近右手待机臂、减少碰机体
  left_x_fine: -0.12
  pre_grasp_back_m: 0.12
  pre_grasp_lift_z: 0.02
  retreat_back_m: 0.08
  retreat_lift_z: 0.04

end_effector_orientation:
  palm_down: [0.0, -0.70682518, 0.0, 0.70738827]
  right:
    quat_xyzw: [-0.5002, -0.4998, -0.4998, 0.5002]
  left:
    quat_xyzw: [0.5002, -0.4998, -0.4998, 0.5002]

inactive_arm_pose:
  left: [0.45, 0.25, 0.11988012]
  right: [0.45, -0.25, 0.11988012]
